[project]
name = "trabalho-eng-dados"
version = "0.1.0"
description = "Trabalho prático de Engenharia de Dados"
readme = "README.md"
authors = [
    { name = "Gabriel Angel", email = "gabrielangelstoss@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.13",
    "pymongo>=4.9",
    "pytest>=9.1.1",
    "pytest-order>=1.5.0",
    "python-decouple>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--order-scope=module"